<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>韓国語フラッシュカード</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="韓国語単語">

<style>
:root {
  --bg:#f5f5f7; --panel:#fff; --text:#111; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#e6007e; --good:#16794b; --bad:#b42318; --shadow:0 14px 40px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
button,select,textarea,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;letter-spacing:.01em}
.meta{font-size:12px;color:var(--muted);text-align:right}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}
select,.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--text)}
.ghost{cursor:pointer}
.progress{height:6px;background:#e8e8ed;border-radius:99px;overflow:hidden;margin:10px 0 16px}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);min-height:500px;padding:24px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{font-size:12px;background:#f2f2f7;color:var(--muted);border-radius:999px;padding:6px 9px}
.star{border:0;background:transparent;font-size:27px;line-height:1;cursor:pointer;color:#b7b7bd;padding:4px}
.star.on{color:#f4b400}
.stage{display:none;animation:fade .18s ease}
.stage.show{display:block}
@keyframes fade{from{opacity:.15;transform:translateY(4px)}to{opacity:1;transform:none}}
.wordWrap{text-align:center;margin:auto 0}
.korean{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:64px;font-weight:780;line-height:1.18;word-break:keep-all}
.play{border:0;background:#f2f2f7;border-radius:999px;padding:11px 15px;cursor:pointer;margin-top:18px}
.answer{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:7px}
.pron{font-size:22px;color:var(--accent);font-weight:700}
.meaning{font-size:28px;font-weight:760;line-height:1.35;margin-top:5px}
.exampleKo{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:30px;font-weight:650;line-height:1.45}
.exampleJa{font-size:22px;line-height:1.55}
.memo{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa;color:var(--text)}
.actionbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.primary,.good,.bad,.secondary{border:0;border-radius:14px;padding:14px 16px;font-weight:750;cursor:pointer}
.primary{background:var(--text);color:#fff;grid-column:1 / -1}
.secondary{background:#f2f2f7;color:var(--text)}
.good{background:#e9f7ef;color:var(--good)}
.bad{background:#fff0ef;color:var(--bad)}
.footerNav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.small{font-size:12px;color:var(--muted)}
.stats{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){
  .app{padding:10px 10px 28px}
  .card{min-height:calc(100vh - 170px);border-radius:20px;padding:20px 18px}
  .korean{font-size:52px}
  .meaning{font-size:25px}
  .exampleKo{font-size:27px}
  .exampleJa{font-size:20px}
  .controls{grid-template-columns:1fr auto}
  .controls .ghost:nth-child(3){display:none}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111214;--panel:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#343438;--shadow:none}
  select,.ghost{background:#1c1c1e;color:#f5f5f7}
  .badge,.play,.secondary{background:#2c2c2e}
  .memo{background:#242426;color:#fff}
  .good{background:#173b2a} .bad{background:#421e1b}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand">韓国語フラッシュカード</div>
      <div class="small" id="deckCount"></div>
    </div>
    <div class="meta"><span id="cardId"></span><br><span id="lesson"></span></div>
  </div>

  <div class="controls">
    <select id="deckFilter" aria-label="学習範囲">
      <option value="all">すべて</option>
      <option value="5級">5級</option>
      <option value="4級">4級</option>
      <option value="fav">★ お気に入り</option>
    </select>
    <button class="ghost" id="shuffleBtn">⇄ シャッフル</button>
    <button class="ghost" id="resetBtn">進捗リセット</button>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <main class="card" id="card">
    <div class="cardhead">
      <span class="badge" id="category"></span>
      <button class="star" id="starBtn" aria-label="お気に入り">★</button>
    </div>

    <div class="wordWrap">
      <section class="stage show" data-stage="0">
        <div class="korean" id="korean"></div>
        <button class="play" id="playWord">🔊 単語を聞く</button>
      </section>

      <section class="stage" data-stage="1">
        <div class="answer">
          <div class="label">読み</div>
          <div class="pron" id="pronunciation"></div>
          <div class="label" style="margin-top:20px">日本語</div>
          <div class="meaning" id="meaning"></div>
        </div>
      </section>

      <section class="stage" data-stage="2">
        <div class="answer">
          <div class="label">例文</div>
          <div class="exampleKo" id="exampleKo"></div>
          <button class="play" id="playExample">🔊 例文を聞く</button>
        </div>
      </section>

      <section class="stage" data-stage="3">
        <div class="answer">
          <div class="label">例文の訳</div>
          <div class="exampleJa" id="exampleJa"></div>
          <div class="label" style="margin-top:22px">メモ</div>
          <textarea class="memo" id="memo" placeholder="この単語についてメモ…"></textarea>
        </div>
      </section>
    </div>

    <div class="actionbar" id="actionbar">
      <button class="primary" id="revealBtn">日本語訳と読みを表示</button>
    </div>
    <div class="stats" id="stats"></div>
  </main>

  <div class="footerNav">
    <button class="ghost" id="prevBtn">← 前</button>
    <button class="ghost" id="nextBtn">次 →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

rrect_count":0,"wrong_count":0,"last_reviewed":null,"next_review":null,"memo":""},{"id":"908","lesson":"4級_42日目_副詞04","source":"TR101","korean":"정말로","pronunciation":"チョンマルロ","meaning":"本当に、間違いなく、誠に","example_ko":"정말로 같이 안 갈 거예요?","example_ja":"本当に一緒に行かないつもりですか？","note":"","category":"副詞","favorite":false,"tags":[],"correct_count":0,"wrong_count":0,"last_reviewed":null,"next_review":null,"memo":""},{"id":"909","lesson":"4級_42日目_副詞04","source":"TR101","korean":"참","pronunciation":"チャム","meaning":"本当に、誠に、（名詞として）本当、真実","example_ko":"어머니가 해 주신 음식이 참 맛있어요.","example_ja":"母が作ってくださった料理はとてもおいしいです。","note":"","category":"副詞","favorite":false,"tags":[],"correct_count":0,"wrong_count":0,"last_reviewed":null,"next_review":null,"memo":""},{"id":"910","lesson":"4級_42日目_副詞04","source":"TR101","korean":"진짜","pronunciation":"チンチャ","meaning":"本当に、（名詞として）本物","example_ko":"거기에 진짜 갈 생각이에요?","example_ja":"そこに本当に行くつもりですか？","note":"","category":"副詞","favorite":false,"tags":[],"correct_count":0,"wrong_count":0,"last_reviewed":null,"next_review":null,"memo":""}];
const STORAGE_KEY = "kr_flashcards_state_v1";

let state = loadState();
let deck = [];
let pos = 0;
let stage = 0;
let shuffled = false;

function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return { currentId:s.currentId || "001", overrides:s.overrides || {}, filter:s.filter || "all", shuffled:!!s.shuffled };
  } catch(e) {
    return { currentId:"001", overrides:{}, filter:"all", shuffled:false };
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function ov(id){
  if(!state.overrides[id]) state.overrides[id]={};
  return state.overrides[id];
}
function merged(card){
  return Object.assign({}, card, ov(card.id));
}
function buildDeck(){
  const filter = document.getElementById("deckFilter").value;
  state.filter = filter;
  deck = CARDS.filter(c => {
    if(filter === "all") return true;
    if(filter === "fav") return !!merged(c).favorite;
    return c.lesson.startsWith(filter + "_");
  });
  if(shuffled) shuffleArray(deck);
  if(deck.length === 0) {
    document.getElementById("deckCount").textContent = "対象カード 0枚";
    return;
  }
  let idx = deck.findIndex(c => c.id === state.currentId);
  pos = idx >= 0 ? idx : 0;
  render(true);
  saveState();
}
function shuffleArray(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}
function cardNow(){ return deck[pos]; }
function showToast(t){
  const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1200);
}
function speak(text){
  if(!text) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ko-KR"; u.rate=.84; u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const ko=voices.find(v => /^ko(-|_)/i.test(v.lang));
  if(ko) u.voice=ko;
  speechSynthesis.speak(u);
}
function setStage(n){
  stage=Math.max(0,Math.min(3,n));
  document.querySelectorAll(".stage").forEach(s => {
    const sn=Number(s.dataset.stage);
    s.classList.toggle("show", sn <= stage);
  });
  const bar=document.getElementById("actionbar");
  if(stage===0) bar.innerHTML='<button class="primary" id="revealBtn">日本語訳と読みを表示</button>';
  if(stage===1) bar.innerHTML='<button class="primary" id="revealBtn">例文を表示</button>';
  if(stage===2) bar.innerHTML='<button class="primary" id="revealBtn">訳文とメモを表示</button>';
  if(stage===3) bar.innerHTML='<button class="bad" id="wrongBtn">× もう一度</button><button class="good" id="correctBtn">○ 覚えた</button>';
  const r=document.getElementById("revealBtn"); if(r) r.onclick=()=>setStage(stage+1);
  const w=document.getElementById("wrongBtn"); if(w) w.onclick=()=>grade(false);
  const c=document.getElementById("correctBtn"); if(c) c.onclick=()=>grade(true);
}
function render(resetStage=false){
  if(!deck.length) return;
  const c=merged(cardNow());
  state.currentId=c.id;
  if(resetStage) stage=0;

  document.getElementById("cardId").textContent="#"+c.id;
  document.getElementById("lesson").textContent=c.lesson.replaceAll("_"," ");
  document.getElementById("category").textContent=c.category || "";
  document.getElementById("korean").textContent=c.korean || "";
  document.getElementById("pronunciation").textContent=c.pronunciation || "";
  document.getElementById("meaning").textContent=c.meaning || "";
  document.getElementById("exampleKo").textContent=c.example_ko || "（例文なし）";
  document.getElementById("exampleJa").textContent=c.example_ja || "（訳文なし）";
  document.getElementById("memo").value=c.memo || "";
  document.getElementById("starBtn").classList.toggle("on", !!c.favorite);

  const cc=Number(c.correct_count||0), wc=Number(c.wrong_count||0);
  document.getElementById("stats").textContent=`正解 ${cc}回 ／ もう一度 ${wc}回`;
  document.getElementById("deckCount").textContent=`対象カード ${deck.length}枚 ・ ${pos+1} / ${deck.length}`;
  document.getElementById("progressBar").style.width=((pos+1)/deck.length*100)+"%";
  setStage(stage);
  saveState();
}
function persistMemo(){
  if(!deck.length) return;
  ov(cardNow().id).memo=document.getElementById("memo").value;
  saveState();
}
function grade(ok){
  const c=merged(cardNow()), o=ov(c.id);
  if(ok) o.correct_count=Number(c.correct_count||0)+1;
  else o.wrong_count=Number(c.wrong_count||0)+1;
  o.last_reviewed=new Date().toISOString();
  persistMemo();
  saveState();
  showToast(ok ? "覚えた ✓" : "もう一度");
  move(1);
}
function move(delta){
  if(!deck.length) return;
  persistMemo();
  pos=(pos+delta+deck.length)%deck.length;
  state.currentId=deck[pos].id;
  stage=0; render(true);
}
document.getElementById("playWord").onclick=()=>speak(merged(cardNow()).korean);
document.getElementById("playExample").onclick=()=>speak(merged(cardNow()).example_ko);
document.getElementById("prevBtn").onclick=()=>move(-1);
document.getElementById("nextBtn").onclick=()=>move(1);
document.getElementById("memo").addEventListener("input", persistMemo);
document.getElementById("starBtn").onclick=()=>{
  const c=merged(cardNow()), o=ov(c.id); o.favorite=!c.favorite; saveState(); render(false);
  showToast(o.favorite ? "お気に入りに追加 ★" : "お気に入りを解除");
};
document.getElementById("deckFilter").value=state.filter || "all";
document.getElementById("deckFilter").onchange=()=>{ stage=0; buildDeck(); };
document.getElementById("shuffleBtn").onclick=()=>{
  shuffled=!shuffled; state.shuffled=shuffled;
  document.getElementById("shuffleBtn").textContent=shuffled ? "⇄ シャッフル中" : "⇄ シャッフル";
  buildDeck(); showToast(shuffled ? "シャッフル ON" : "シャッフル OFF");
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("学習回数・お気に入り・メモ・現在位置をリセットしますか？")){
    localStorage.removeItem(STORAGE_KEY); location.reload();
  }
};
document.getElementById("card").addEventListener("click",(e)=>{
  if(e.target.closest("button,textarea,select")) return;
  if(stage<3) setStage(stage+1);
});
document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="TEXTAREA") return;
  if(e.key===" " || e.key==="Enter"){ e.preventDefault(); if(stage<3) setStage(stage+1); }
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
  if(e.key.toLowerCase()==="p") speak(merged(cardNow()).korean);
});
speechSynthesis.getVoices();
shuffled=state.shuffled;
document.getElementById("shuffleBtn").textContent=shuffled ? "⇄ シャッフル中" : "⇄ シャッフル";
buildDeck();
</script>

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Service Worker registration failed:", err);
    });
  });
}
</script>
